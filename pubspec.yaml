name: wiro
description: >-
  Official Wiro AI SDK for Dart and Flutter with typed model discovery,
  execution, file uploads, task polling, WebSocket streaming, cancellation,
  and structured errors.
version: 0.1.2
homepage: https://wiro.ai
documentation: https://wiro.ai/docs
repository: https://github.com/wiroai/Dart-QuickStart
issue_tracker: https://github.com/wiroai/Dart-QuickStart/issues
topics:
  - ai
  - generative-ai
  - wiro
  - api-client

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  crypto: ^3.0.7
  http: ^1.6.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  coverage: ^1.15.1
  test: ^1.25.6
  # Dart 3.8 resolves 9.0.0 and newer SDKs resolve up to 11.x. Every one of
  # these ships the analysis_options.9.0.0.yaml rule set unchanged, so the
  # lints stay the same on each SDK in the CI matrix.
  very_good_analysis: '>=9.0.0 <12.0.0'
