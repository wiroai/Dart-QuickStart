name: wiro_client
description: >-
  Official Wiro AI SDK for Dart and Flutter with typed model discovery,
  execution, file uploads, task polling, cancellation, and structured errors.
version: 0.1.0
homepage: https://wiro.ai
documentation: https://wiro.ai/docs
repository: https://github.com/wiroai/wiro-dart
issue_tracker: https://github.com/wiroai/wiro-dart/issues
topics:
  - ai
  - generative-ai
  - wiro
  - api-client

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  crypto: ^3.0.7
  http: ^1.6.0

dev_dependencies:
  coverage: ^1.15.1
  test: ^1.25.6
  very_good_analysis: ^9.0.0
