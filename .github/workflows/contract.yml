name: API contract

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  smoke:
    name: Read-only Wiro API smoke test
    runs-on: ubuntu-latest
    env:
      WIRO_API_KEY: ${{ secrets.WIRO_API_KEY }}
      WIRO_API_SECRET: ${{ secrets.WIRO_API_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        # v4.2.2

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        # v2
        with:
          flutter-version: 3.44.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run contract smoke test
        if: env.WIRO_API_KEY != ''
        run: dart run tool/smoke_test.dart

      - name: Report missing contract credentials
        if: env.WIRO_API_KEY == ''
        run: |
          echo "::warning::WIRO_API_KEY is not configured; smoke test skipped."
