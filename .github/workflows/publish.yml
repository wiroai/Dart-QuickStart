name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  quality:
    name: Validate package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        # v2
        with:
          flutter-version: 3.44.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(awk '/^version:/{print $2}' pubspec.yaml)"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Check formatting
        run: >-
          dart format
          --output=none
          --set-exit-if-changed
          lib test tool example/lib example/test example/bin

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test

      - name: Test Flutter example
        working-directory: example
        run: |
          flutter analyze
          flutter test

      - name: Enforce coverage
        run: |
          dart test --coverage=coverage
          dart run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --packages=.dart_tool/package_config.json \
            --report-on=lib
          dart run tool/check_coverage.dart coverage/lcov.info 90

      - name: Validate package
        run: dart pub publish --dry-run

  publish:
    name: Publish package
    needs: quality
    # pub.dev requires the first package version to be published manually.
    if: github.ref_name != 'v0.1.0'
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@7654d458321ee25acccccfdb86cd48bd95768ff1
    with:
      environment: pub.dev
