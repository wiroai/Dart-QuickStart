name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  quality:
    name: Flutter ${{ matrix.flutter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter:
          - 3.32.8
          - 3.44.7

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        # v4.2.2

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        # v2
        with:
          flutter-version: ${{ matrix.flutter }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: >-
          dart format
          --output=none
          --set-exit-if-changed
          lib test tool example/lib example/test example/bin

      - name: Analyze SDK
        run: dart analyze

      - name: Test SDK
        run: dart test

      - name: Analyze Flutter example
        working-directory: example
        run: flutter analyze

      - name: Test Flutter example
        working-directory: example
        run: flutter test

      - name: Collect coverage
        if: matrix.flutter == '3.44.7'
        run: |
          dart test --coverage=coverage
          dart run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --packages=.dart_tool/package_config.json \
            --report-on=lib
          dart run tool/check_coverage.dart coverage/lcov.info 90

      - name: Upload coverage
        if: matrix.flutter == '3.44.7'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        # v5
        with:
          files: coverage/lcov.info
          fail_ci_if_error: true
          use_oidc: true

      - name: Validate package
        if: matrix.flutter == '3.44.7'
        run: dart pub publish --dry-run
